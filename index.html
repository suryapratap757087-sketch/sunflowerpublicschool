const CHARS=[{name:'THUNG M.C',img:SARI_IMG},{name:'FIGHTER 2',img:MAN_IMG}];
const $=id=>document.getElementById(id);let hp=100,ehp=100,t=99,running=false,blocked=false,timer=null,botTimer=null;
$('sariPreview').src=SARI_IMG;$('manPreview').src=MAN_IMG;$('fight').style.backgroundImage='url("'+SCHOOL_IMG+'")';
function choose(i){$('select').style.display='none';$('fight').style.display='block';$('p1').querySelector('img').src=CHARS[i].img;$('p2').querySelector('img').src=CHARS[1-i].img;reset();countdown()}
function reset(){hp=100;ehp=100;t=99;running=false;blocked=false;clearInterval(timer);clearInterval(botTimer);$('ph').style.width='100%';$('eh').style.width='100%';$('time').textContent='99';$('end').style.display='none';$('p1').style.left='7%';$('p2').style.right='7%'}
function countdown(){let n=3,c=$('count');c.style.display='block';c.textContent=n;let x=setInterval(()=>{n--;c.textContent=n>0?n:'FIGHT!';if(n<0){clearInterval(x);c.style.display='none';start()}},650)}
function start(){running=true;timer=setInterval(()=>{t--;$('time').textContent=t;if(t<=0)finish(hp>=ehp)},1000);botTimer=setInterval(botAttack,1200+Math.random()*900)}
function finish(win){if(!running)return;running=false;clearInterval(timer);clearInterval(botTimer);$('result').textContent=win?'YOU WIN! 🏆':'YOU LOSE! 💥';$('end').style.display='flex'}
function flash(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),170)}
function attack(kind){if(!running)return;let d=kind==='punch'?8:kind==='kick'?12:20;ehp=Math.max(0,ehp-d);$('eh').style.width=ehp+'%';flash($('p2'));if(ehp<=0)finish(true)}
function botAttack(){if(!running||blocked)return;let d=[5,7,10][Math.floor(Math.random()*3)];hp=Math.max(0,hp-d);$('ph').style.width=hp+'%';flash($('p1'));if(hp<=0)finish(false)}
document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(!running)return;let a=b.dataset.a;if(a==='left')$('p1').style.left=Math.max(0,parseFloat($('p1').style.left||7)-3)+'%';else if(a==='right')$('p1').style.left=Math.min(65,parseFloat($('p1').style.left||7)+3)+'%';else if(a==='block'){blocked=true;$('p1').style.filter='brightness(.7)';setTimeout(()=>{blocked=false;$('p1').style.filter=''},500)}else attack(a)}));
document.addEventListener('keydown',e=>{if(!running)return;if(e.key==='ArrowLeft')$('p1').style.left=Math.max(0,parseFloat($('p1').style.left||7)-3)+'%';if(e.key==='ArrowRight')$('p1').style.left=Math.min(65,parseFloat($('p1').style.left||7)+3)+'%';if(e.key.toLowerCase()==='a')attack('punch');if(e.key.toLowerCase()==='s')attack('kick');if(e.key.toLowerCase()==='d')attack('special')});
function backToSelect(){clearInterval(timer);clearInterval(botTimer);$('fight').style.display='none';$('select').style.display='flex'}
</script></body></html>
